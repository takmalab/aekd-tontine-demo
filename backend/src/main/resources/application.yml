spring:
  application:
    name: tontine-backend

  datasource:
    url: postgresql://${{PGUSER}}:${{POSTGRES_PASSWORD}}@${{RAILWAY_PRIVATE_DOMAIN}}:5432/${{PGDATABASE}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:5432}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-please-change-me-aekd-tontine-mvp}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

  storage:
    local:
      root: ${APP_STORAGE_ROOT:./storage}