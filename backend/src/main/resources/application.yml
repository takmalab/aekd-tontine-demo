spring:
  application:
    name: tontine-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aekd_tontine}
    username: ${SPRING_DATASOURCE_USERNAME:aekd}
    password: ${SPRING_DATASOURCE_PASSWORD:aekd_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  # "native" derriere un tunnel/proxy HTTPS (partager.bat) : Tomcat lit X-Forwarded-Proto
  # (proxies locaux uniquement), sinon les requetes https seraient vues comme cross-origin.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-please-change-me-aekd-tontine-mvp}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

  storage:
    local:
      root: ${APP_STORAGE_ROOT:./storage}

  frontend:
    # Dossier du frontend compile (frontend/dist/tontine-frontend/browser) a servir
    # par le backend. Vide en developpement : le frontend tourne avec ng serve.
    dir: ${APP_FRONTEND_DIR:}
      
scmchost:
  api-url: ${SCMCHOST_API_URL:https://api.scmchost.com}
  # Secret : à fournir par la variable d'environnement, jamais en clair dans ce fichier.
  api-key: ${SCMCHOST_API_KEY:}
  otp-template-id: ${SCMCHOST_OTP_TEMPLATE_ID:b045f9d9-ba98-4ba1-9884-faab98aa169c}