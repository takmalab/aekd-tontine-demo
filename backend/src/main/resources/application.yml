spring:
  application:
    name: tontine-backend

  # Secrets locaux facultatifs, hors Git (*.env ignore) : cles API des fournisseurs
  # SMS (IGOR_API_KEY=..., SCMCHOST_API_KEY=...).
  config:
    import:
      - optional:file:./igor-sms-gateway.env[.properties]
      - optional:file:./scmchost.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aekd_tontine}
    username: ${SPRING_DATASOURCE_USERNAME:aekd}
    password: ${SPRING_DATASOURCE_PASSWORD:aekd_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Appels sortants (fournisseurs SMS) : ne jamais bloquer une connexion trop longtemps.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 20s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  # "native" derriere un tunnel/proxy HTTPS (partager.bat) : Tomcat lit X-Forwarded-Proto
  # (proxies locaux uniquement), sinon les requetes https seraient vues comme cross-origin.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-please-change-me-aekd-tontine-mvp}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

  storage:
    local:
      root: ${APP_STORAGE_ROOT:./storage}

  frontend:
    # Dossier du frontend compile (frontend/dist/tontine-frontend/browser) a servir
    # par le backend. Vide en developpement : le frontend tourne avec ng serve.
    dir: ${APP_FRONTEND_DIR:}

  # Envoi de SMS (codes de connexion OTP, docs/decisions.md n° 47 et 48).
  # provider : fournisseur par defaut, tant qu un ADMIN n en a pas choisi un dans
  # l ecran Parametres SMS.
  #   log      : simulation, le SMS (et son code) est ecrit dans le journal du backend
  #   igortek  : Igor SMS Gateway (https://sms.igortek.com/fr/docs)
  #   scmchost : SCMC Host (https://sms.scmchost.com/docs/), par modele approuve
  sms:
    provider: ${APP_SMS_PROVIDER:log}
    igortek:
      base-url: ${IGORTEK_SMS_BASE_URL:https://api.sms.igortek.com}
      # Secret : uniquement par variable d environnement, jamais en clair dans ce fichier.
      api-key: ${IGORTEK_SMS_API_KEY:${IGOR_API_KEY:}}
    scmchost:
      base-url: ${SCMCHOST_API_URL:https://api.scmchost.com}
      api-key: ${SCMCHOST_API_KEY:}
      # Modele approuve pour les codes de connexion, et sa variable qui recoit le code.
      otp-template-id: ${SCMCHOST_OTP_TEMPLATE_ID:b045f9d9-ba98-4ba1-9884-faab98aa169c}
      code-variable: ${SCMCHOST_OTP_CODE_VARIABLE:CODE}

  # Connexion par code SMS (valeurs validees, decisions.md n° 47).
  otp:
    code-length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 60s
    max-requests-per-hour: 5
