spring:
  datasource:
    # Base dediee aux tests, distincte de la base de dev/demo : les tests
    # supposent un etat vierge (aucune seance, aucune politique de pret...)
    # et ne doivent jamais voir les donnees de demonstration seedees dans
    # aekd_tontine.
    url: jdbc:postgresql://localhost:5432/aekd_tontine_test

app:
  tournament:
    scheduler:
      # Les tests appellent la generation explicitement, avec une date maitrisee.
      enabled: false
  notification:
    reminders:
      # Les tests appellent l'envoi des rappels explicitement, avec une date maitrisee.
      enabled: false

  storage:
    local:
      # Isole les tests du dossier de stockage de dev (evite de laisser des
      # fichiers orphelins dans backend/storage a chaque execution).
      root: ${java.io.tmpdir}/aekd-tontine-test-storage

  # Aucun SMS reel pendant les tests : simulation, et cles neutralisees meme si un
  # fichier .env local (igor-sms-gateway.env, scmchost.env) est present.
  sms:
    provider: log
    igortek:
      api-key: ""
    scmchost:
      api-key: ""
